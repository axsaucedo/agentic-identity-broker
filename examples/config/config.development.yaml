# Agentic Identity Broker - Development Configuration
# Use this configuration for local development environments
# To run: identity-broker --config ./examples/config/config.development.yaml

log:
  # Development uses debug level for detailed logs
  level: debug
  # Text format is easier to read during development
  format: text

server:
  # End-user server configuration (public-facing API)
  enduser:
    # Lower port for easier local testing (no sudo required)
    port: 3000
    # Bind to localhost only for development security
    bind: 127.0.0.1
    # Authentication configuration for end-user server
    authentication:
      # Pre-authentication mode: Trust principals from reverse proxy headers
      preauth:
        # HTTP header containing the authenticated user principal
        # In development, you can use curl to send test principals:
        # curl -H "X-Custom-Principal: testuser" http://localhost:3000/api/endpoint
        principal_header_name: X-Custom-Principal

  # Admin server configuration (internal management API)
  admin:
    # Sequential port for convenience
    port: 3001
    # Bind to localhost only for development security
    bind: 127.0.0.1
    # Authentication configuration for admin server
    authentication:
      # Pre-authentication mode: Trust principals from reverse proxy headers
      preauth:
        # HTTP header containing the authenticated user principal
        principal_header_name: X-Custom-Principal

  # Graceful shutdown configuration
  shutdown:
    # Shorter timeout for faster development cycles
    timeout: 5s

storage:
  # Development uses in-memory storage for rapid iteration
  backend: memory
  timeouts:
    read: 5s
    write: 10s

encryption:
  # Memory backend for development (uses base64-encoded AES-256 key)
  memory:
    # Base64-encoded 32-byte AES-256 key (can be set via environment variable)
    # Default fallback key provided for development convenience
    raw_key: ${IDENTITY_BROKER_ENCRYPTION_MEMORY_RAW_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

  # AWS KMS backend not used in development
  # aws_kms: null

