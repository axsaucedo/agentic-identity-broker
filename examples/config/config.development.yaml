# Agentic Identity Broker - Development Configuration
# Use this configuration for local development environments
# To run: identity-broker --config ./examples/config/config.development.yaml

log:
  # Development uses debug level for detailed logs
  level: debug
  # Text format is easier to read during development
  format: text

