# Agentic Identity Broker - Production Configuration
# Use this configuration for production environments
# IMPORTANT: All sensitive values MUST be provided via environment variables
# Never commit actual values to version control
# To run: identity-broker --config ./examples/config/config.production.yaml

log:
  # Production uses info level (reduce noise while maintaining visibility)
  # Override with --log-level flag if needed at runtime
  level: ${IDENTITY_BROKER_LOG_LEVEL:info}
  # JSON format enables structured logging for monitoring and log aggregation
  format: ${IDENTITY_BROKER_LOG_FORMAT:json}

server:
  # End-user server configuration (public-facing API)
  enduser:
    # Standard port for end-user traffic
    port: 8000
    # Bind to all interfaces (dual-stack IPv6/IPv4)
    # In containerized environments, this allows traffic from load balancers
    bind: "::"

  # Admin server configuration (internal management API)
  admin:
    # Standard admin port
    port: 14000
    # SECURITY: In production, admin server should be restricted to private network
    # Options:
    #   - Use firewall rules to restrict access
    #   - Bind to internal IP (e.g., 10.0.1.0)
    #   - Use separate network namespace in Kubernetes
    # For this example, we bind to all interfaces but firewall rules should restrict access
    bind: "::"

  # Graceful shutdown configuration
  shutdown:
    # Longer timeout in production to allow in-flight requests to complete
    # Adjust based on your application's longest request duration
    timeout: 60s

storage:
  # Production uses PostgreSQL for persistence and high availability
  backend: postgres
  postgres:
    # Connection URL MUST come from environment variable in production
    # Uses in-memory backend if not provided (for testing/demos)
    connection_url: ${IDENTITY_BROKER_STORAGE_POSTGRES_URL:postgresql://localhost:5432/identity_broker}
  timeouts:
    read: 5s
    write: 10s

