server:
  port: 8001
  bind: "127.0.0.1"

oauth2:
  # Uses the upstream-oauth2-client credentials from the mock upstream OAuth2 server
  client_id: "upstream-oauth2-client"
  client_secret: "upstream-oauth2-secret-xyz"
  redirect_uri: "http://127.0.0.1:8001/oauth2/callback"
  scopes:
    - "openid"
    - "profile"
    - "email"

broker:
  # Identity Broker configuration
  base_url: "http://localhost:3000"
  authorize_endpoint: "http://localhost:3000/oauth2/authorize"
  token_endpoint: "http://localhost:3000/oauth2/token"
  metadata_endpoint: "http://localhost:3000/.well-known/oauth-authorization-server"
