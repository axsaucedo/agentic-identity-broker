openapi: 3.0.0
info:
  title: OAuth2 Authorization Server API
  version: 1.0.0
  description: |
    OAuth2 Authorization Server implementation following RFC 6749 and RFC 8414.

    This server provides OAuth2 authorization code flow endpoints for delegated
    access to third-party OAuth2 services. The authorization broker handles
    user consent management and proxies token requests to upstream OAuth2 providers.
  contact:
    name: API Support
    url: https://github.com/agentic-identity-broker/agentic-identity-broker
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://broker.example.com
    description: Production environment
  - url: http://localhost:8000
    description: Local development environment

tags:
  - name: OAuth2 Authorization
    description: OAuth2 authorization endpoint for authorization code flow
  - name: OAuth2 Token
    description: Token endpoint for exchanging authorization codes for access tokens
  - name: OAuth2 Discovery
    description: Server metadata discovery endpoint (RFC 8414)

paths:
  /oauth2/authorize:
    get:
      tags:
        - OAuth2 Authorization
      summary: Authorization Endpoint
      description: |
        OAuth2 authorization endpoint for initiating the authorization code flow.

        This endpoint initiates the OAuth2 authorization code flow. The broker
        validates the request parameters and either:
        1. Redirects to the upstream OAuth2 provider (if user has an active grant)
        2. Redirects to the consent UI (if user needs to grant permission)
        3. Returns an error response (if validation fails)

        **Security Requirements:**
        - Requires `X-Remote-User` header for authentication (set by upstream proxy)
        - Only supports `response_type=code`
        - Validates `client_id`, `redirect_uri`, and required parameters

        **RFC Compliance:** RFC 6749 - Authorization Request
      operationId: authorize
      security:
        - BearerToken: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: The unique identifier for the OAuth2 client (agent)
          example: agent-1

        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
          description: |
            The URI to redirect the user to after authorization.
            Must be registered with the client.
          example: https://client.example.com/callback

        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
          description: Must be `code` for authorization code flow
          example: code

        - name: scope
          in: query
          required: false
          schema:
            type: string
          description: Space-separated list of requested scopes
          example: "openid profile email"

        - name: state
          in: query
          required: false
          schema:
            type: string
          description: |
            Opaque value used by client to maintain state between request and callback.
            Recommended for security (CSRF protection).
          example: state-123

        - name: code_challenge
          in: query
          required: false
          schema:
            type: string
          description: |
            PKCE code challenge (RFC 7636).
            Base64url-encoded SHA256 hash of code_verifier.
          example: E9Mrozoa2owUednMg_bhuvjYecLXBIstEvM04KS16-I

        - name: code_challenge_method
          in: query
          required: false
          schema:
            type: string
            enum: [plain, S256]
          description: PKCE code challenge method. Must be `S256` (recommended) or `plain`.
          example: S256

      responses:
        '302':
          description: Redirect to upstream provider or consent UI
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: |
                Redirect target URL. Either:
                - Upstream OAuth2 authorize endpoint (if active grant exists)
                - Consent UI (if grant needed)
                - Error redirect (if validation fails)

        '400':
          description: Bad Request - Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_client:
                  summary: Invalid client_id
                  value:
                    error: invalid_client
                    error_description: Client not found
                invalid_request:
                  summary: Missing required parameters
                  value:
                    error: invalid_request
                    error_description: Missing required parameter redirect_uri

        '403':
          description: Forbidden - User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: access_denied
                error_description: Authentication required

        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /oauth2/token:
    post:
      tags:
        - OAuth2 Token
      summary: Token Endpoint
      description: |
        OAuth2 token endpoint for exchanging authorization codes for access tokens.

        This endpoint exchanges authorization codes for access tokens by proxying
        the request to the upstream OAuth2 provider. The broker:
        1. Validates the Content-Type and request format
        2. Filters HTTP hop-by-hop headers (RFC 7230)
        3. Forwards the request to upstream token endpoint
        4. Returns the upstream response unchanged

        **Security Requirements:**
        - Content-Type must be `application/x-www-form-urlencoded`
        - Hop-by-hop headers are filtered and not forwarded
        - All parameters forwarded transparently (no validation)

        **RFC Compliance:** RFC 6749 - Access Token Request, RFC 7230 - HTTP Semantics
      operationId: token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                  description: The OAuth2 grant type
                  example: authorization_code

                code:
                  type: string
                  description: |
                    Authorization code (for authorization_code grant).
                    Obtained from authorization endpoint.
                  example: auth_code_123

                redirect_uri:
                  type: string
                  format: uri
                  description: |
                    Redirect URI from authorization request (for authorization_code grant).
                    Must match the authorization request.
                  example: https://client.example.com/callback

                client_id:
                  type: string
                  description: Client identifier
                  example: client-1

                client_secret:
                  type: string
                  description: Client secret (for confidential clients)
                  example: secret-xyz

                refresh_token:
                  type: string
                  description: |
                    Refresh token (for refresh_token grant).
                    Used to obtain a new access token.
                  example: refresh_token_abc

                scope:
                  type: string
                  description: Requested scopes (optional, for refresh token grant)
                  example: "openid profile"
            examples:
              authorization_code:
                summary: Authorization Code Grant
                value:
                  grant_type: authorization_code
                  code: auth_code_123
                  redirect_uri: https://client.example.com/callback
                  client_id: client-1
                  client_secret: secret-xyz

              refresh_token:
                summary: Refresh Token Grant
                value:
                  grant_type: refresh_token
                  refresh_token: refresh_token_abc
                  client_id: client-1
                  client_secret: secret-xyz

      responses:
        '200':
          description: Successful token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: slAV32hkKG
                token_type: Bearer
                expires_in: 3600
                refresh_token: refreshtoken123
                scope: "openid profile"

        '400':
          description: Bad Request - Invalid request format or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_request:
                  summary: Missing required parameter
                  value:
                    error: invalid_request
                    error_description: Missing required parameter grant_type
                invalid_grant:
                  summary: Invalid authorization code
                  value:
                    error: invalid_grant
                    error_description: Authorization code has expired
                unsupported_grant_type:
                  summary: Unsupported grant type
                  value:
                    error: unsupported_grant_type
                    error_description: Grant type not supported

        '401':
          description: Unauthorized - Client authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid_client
                error_description: Client authentication failed

        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /.well-known/oauth-authorization-server:
    get:
      tags:
        - OAuth2 Discovery
      summary: OAuth2 Authorization Server Metadata
      description: |
        OAuth2 authorization server metadata endpoint.

        Returns server metadata including endpoint locations and capabilities.
        This endpoint is used by clients to discover authorization server
        capabilities and endpoints.

        **Security:** No authentication required (public endpoint)

        **RFC Compliance:** RFC 8414 - OAuth 2.0 Authorization Server Metadata
      operationId: getMetadata
      responses:
        '200':
          description: Authorization server metadata
          headers:
            Cache-Control:
              schema:
                type: string
              description: Recommended caching directive (e.g., "max-age=3600")
            Content-Type:
              schema:
                type: string
              description: Must be "application/json"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataResponse'
              example:
                issuer: https://broker.example.com
                authorization_endpoint: https://broker.example.com/oauth2/authorize
                token_endpoint: https://broker.example.com/oauth2/token
                response_types_supported: [code]
                grant_types_supported: [authorization_code, refresh_token]
                token_endpoint_auth_methods_supported: [client_secret_basic, client_secret_post]
                response_modes_supported: [query, fragment]
                scopes_supported: [openid, profile, email]
                code_challenge_methods_supported: [S256, plain]

        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      description: |
        Bearer token authentication via X-Remote-User header.
        Set by upstream authentication proxy (oauth2-proxy, nginx, etc.)
      bearerFormat: X-Remote-User

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - unauthorized_client
            - access_denied
            - unsupported_response_type
            - invalid_scope
            - server_error
            - temporarily_unavailable
            - invalid_client
            - invalid_grant
            - unsupported_grant_type
          description: OAuth2 error code

        error_description:
          type: string
          description: Human-readable error description

        error_uri:
          type: string
          format: uri
          description: URI for additional error information

    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
      properties:
        access_token:
          type: string
          description: The access token issued by the authorization server

        token_type:
          type: string
          enum: [Bearer]
          description: Token type (always "Bearer")

        expires_in:
          type: integer
          description: Lifetime of access token in seconds

        refresh_token:
          type: string
          description: Refresh token (if issued)

        scope:
          type: string
          description: Granted scopes (if different from requested)

    MetadataResponse:
      type: object
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - response_types_supported
        - grant_types_supported
      properties:
        issuer:
          type: string
          format: uri
          description: |
            The issuer identifier. Must be an HTTPS URI with no query or fragment.

        authorization_endpoint:
          type: string
          format: uri
          description: URL of the authorization endpoint

        token_endpoint:
          type: string
          format: uri
          description: URL of the token endpoint

        userinfo_endpoint:
          type: string
          format: uri
          description: URL of the userinfo endpoint (if supported)

        jwks_uri:
          type: string
          format: uri
          description: URL of the JWKS endpoint (if supported)

        registration_endpoint:
          type: string
          format: uri
          description: URL of the dynamic client registration endpoint (if supported)

        response_types_supported:
          type: array
          items:
            type: string
          description: OAuth2 response types supported
          example: [code]

        response_modes_supported:
          type: array
          items:
            type: string
          description: Response modes supported
          example: [query, fragment]

        grant_types_supported:
          type: array
          items:
            type: string
          description: Grant types supported
          example: [authorization_code, refresh_token]

        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          description: Token endpoint authentication methods
          example: [client_secret_basic, client_secret_post]

        token_endpoint_auth_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: Signing algorithms for client authentication

        service_documentation:
          type: string
          format: uri
          description: URL of service documentation

        ui_locales_supported:
          type: array
          items:
            type: string
          description: UI locales supported

        op_policy_uri:
          type: string
          format: uri
          description: URL of operator policy

        op_tos_uri:
          type: string
          format: uri
          description: URL of operator terms of service

        revocation_endpoint:
          type: string
          format: uri
          description: Token revocation endpoint URL

        introspection_endpoint:
          type: string
          format: uri
          description: Token introspection endpoint URL

        code_challenge_methods_supported:
          type: array
          items:
            type: string
          description: PKCE code challenge methods supported
          example: [S256, plain]

        scopes_supported:
          type: array
          items:
            type: string
          description: Scopes supported by the server
          example: [openid, profile, email]

security:
  - BearerToken: []
