{{- if or .Values.broker.security.csrfKey .Values.broker.security.csrfKeyBase64 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentic-identity-broker.fullname" . }}-csrf-key
  namespace: {{ include "agentic-identity-broker.namespace" . }}
  labels:
    {{- include "agentic-identity-broker.labels" . | nindent 4 }}
type: Opaque
data:
  csrf-key: {{ if .Values.broker.security.csrfKeyBase64 }}{{ .Values.broker.security.csrfKeyBase64 | quote }}{{ else }}{{ .Values.broker.security.csrfKey | b64enc | quote }}{{ end }}
{{- end }}
