apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentic-identity-broker.fullname" . }}-config
  namespace: {{ include "agentic-identity-broker.namespace" . }}
  labels:
    {{- include "agentic-identity-broker.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Agentic Identity Broker Configuration
    # Generated by Helm chart

    # Logging configuration
    log:
      level: {{ .Values.broker.log.level }}
      format: {{ .Values.broker.log.format }}

    # Server configuration
    server:
      # End-user API
      enduser:
        port: {{ .Values.broker.server.enduser.port }}
        bind: {{ .Values.broker.server.enduser.bind | quote }}
        {{- if .Values.broker.server.enduser.publicUrl }}
        public_url: {{ .Values.broker.server.enduser.publicUrl }}
        {{- end }}
        {{- $enduserPreauth := .Values.broker.server.enduser.authentication.preauth.principalHeaderName }}
        {{- $enduserJwt := .Values.broker.server.enduser.authentication.jwt }}
        {{- if or $enduserPreauth $enduserJwt }}
        authentication:
          {{- if $enduserPreauth }}
          preauth:
            principal_header_name: {{ $enduserPreauth }}
          {{- end }}
          {{- if $enduserJwt }}
          jwt:
            {{- toYaml $enduserJwt | nindent 12 }}
          {{- end }}
        {{- end }}

      # Admin API
      admin:
        port: {{ .Values.broker.server.admin.port }}
        bind: {{ .Values.broker.server.admin.bind | quote }}
        {{- if .Values.broker.server.admin.publicUrl }}
        public_url: {{ .Values.broker.server.admin.publicUrl }}
        {{- end }}
        {{- $adminPreauth := .Values.broker.server.admin.authentication.preauth.principalHeaderName }}
        {{- $adminJwt := .Values.broker.server.admin.authentication.jwt }}
        {{- if or $adminPreauth $adminJwt }}
        authentication:
          {{- if $adminPreauth }}
          preauth:
            principal_header_name: {{ $adminPreauth }}
          {{- end }}
          {{- if $adminJwt }}
          jwt:
            {{- toYaml $adminJwt | nindent 12 }}
          {{- end }}
        {{- end }}

      # Graceful shutdown
      shutdown:
        timeout: {{ .Values.broker.server.shutdown.timeout }}

    # Third-party OAuth2 configuration
    third_party_oauth2:
      jwe_signing_key: ${IDENTITY_BROKER_JWE_SIGNING_KEY}

    {{- if or .Values.broker.encryption.memory.rawKey .Values.broker.encryption.awsKms.keyArn }}
    # Encryption configuration
    encryption:
      {{- if .Values.broker.encryption.memory.rawKey }}
      memory:
        raw_key: ${IDENTITY_BROKER_ENCRYPTION_MEMORY_RAW_KEY}
      {{- end }}
      {{- if .Values.broker.encryption.awsKms.keyArn }}
      aws_kms:
        key_arn: {{ .Values.broker.encryption.awsKms.keyArn | quote }}
        {{- if .Values.broker.encryption.awsKms.dynamodbTableName }}
        dynamodb_table_name: {{ .Values.broker.encryption.awsKms.dynamodbTableName | quote }}
        {{- end }}
        {{- if .Values.broker.encryption.awsKms.branchKeyTtl }}
        branch_key_ttl: {{ .Values.broker.encryption.awsKms.branchKeyTtl | quote }}
        {{- end }}
        {{- if .Values.broker.encryption.awsKms.region }}
        region: {{ .Values.broker.encryption.awsKms.region | quote }}
        {{- end }}
        {{- if .Values.broker.encryption.awsKms.dynamodbRegion }}
        dynamodb_region: {{ .Values.broker.encryption.awsKms.dynamodbRegion | quote }}
        {{- end }}
        {{- if .Values.broker.encryption.awsKms.dynamodbReadTimeout }}
        dynamodb_read_timeout: {{ .Values.broker.encryption.awsKms.dynamodbReadTimeout | quote }}
        {{- end }}
        {{- if .Values.broker.encryption.awsKms.dynamodbWriteTimeout }}
        dynamodb_write_timeout: {{ .Values.broker.encryption.awsKms.dynamodbWriteTimeout | quote }}
        {{- end }}
      {{- end }}
    {{- end }}

    {{- $oauth2Mode := .Values.broker.oauth2AuthorizationServer.mode }}
    {{- if or .Values.broker.oauth2AuthorizationServer.upstreamIssuerUri (eq $oauth2Mode "local") (eq $oauth2Mode "hybrid") (eq $oauth2Mode "proxy") }}
    # OAuth2 Authorization Server configuration
    oauth2_authorization_server:
      mode: {{ $oauth2Mode }}
      supported_response_types:
        {{- toYaml .Values.broker.oauth2AuthorizationServer.supportedResponseTypes | nindent 8 }}
      supported_grant_types:
        {{- toYaml .Values.broker.oauth2AuthorizationServer.supportedGrantTypes | nindent 8 }}
      {{- with .Values.broker.oauth2AuthorizationServer.multiAgentClient }}
      multi_agent_client:
        enabled: {{ .enabled }}
        {{- if .agentIdParamName }}
        agent_id_param_name: {{ .agentIdParamName | quote }}
        {{- end }}
        {{- if .agentIdClaimName }}
        agent_id_claim_name: {{ .agentIdClaimName | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.broker.oauth2AuthorizationServer.upstreamIssuerUri }}
      proxy:
        upstream_issuer_uri: {{ .Values.broker.oauth2AuthorizationServer.upstreamIssuerUri }}
        upstream_authorize_endpoint: {{ .Values.broker.oauth2AuthorizationServer.upstreamAuthorizeEndpoint }}
        upstream_token_endpoint: {{ .Values.broker.oauth2AuthorizationServer.upstreamTokenEndpoint }}
        upstream_timeout_seconds: {{ .Values.broker.oauth2AuthorizationServer.upstreamTimeoutSeconds }}
      {{- end }}
      {{- if or (eq $oauth2Mode "local") (eq $oauth2Mode "hybrid") }}
      {{- with .Values.broker.oauth2AuthorizationServer.local }}
      {{- if or .tokenTtl .tokenClaimsExpression }}
      local:
        {{- if .tokenTtl }}
        token_ttl: {{ .tokenTtl | quote }}
        {{- end }}
        {{- if .tokenClaimsExpression }}
        token_claims_expression: {{ .tokenClaimsExpression | quote }}
        {{- end }}
      {{- end }}
      {{- end }}
      {{- with .Values.broker.oauth2AuthorizationServer.cimd }}
      cimd:
        enabled: {{ .enabled }}
        fetch_timeout: {{ .fetchTimeout | quote }}
        max_response_bytes: {{ .maxResponseBytes }}
        cache:
          max_ttl: {{ .cache.maxTtl | quote }}
          min_ttl: {{ .cache.minTtl | quote }}
        ssrf:
          extra_blocked_cidrs: {{ toJson .ssrf.extraBlockedCidrs }}
        client_name_blocklist: {{ toJson .clientNameBlocklist }}
      {{- end }}
      {{- end }}
    {{- end }}

    {{- with .Values.broker.tokenExchange }}
    # Token exchange configuration (RFC 8693)
    token_exchange:
      {{- if .expectedAudience }}
      expected_audience: {{ .expectedAudience | quote }}
      {{- end }}
      claim_extraction:
        principal_expression: {{ .claimExtraction.principalExpression | quote }}
        agent_id_expression: {{ .claimExtraction.agentIdExpression | quote }}
      authorization:
        type: {{ .authorization.type | quote }}
        cel:
          expression: {{ .authorization.cel.expression | quote }}
          {{- if .authorization.cel.evaluationTimeout }}
          evaluation_timeout: {{ .authorization.cel.evaluationTimeout | quote }}
          {{- end }}
    {{- end }}

    # Security configuration
    security:
      skip_thirdparty_https_validation: {{ .Values.broker.security.skipThirdpartyHttpsValidation }}

    {{- if .Values.broker.telemetry.enabled }}
    # OpenTelemetry observability configuration
    telemetry:
      enabled: true
      service_name: {{ .Values.broker.telemetry.serviceName | quote }}
      {{- if .Values.broker.telemetry.resourceAttributes }}
      resource_attributes:
        {{- toYaml .Values.broker.telemetry.resourceAttributes | nindent 8 }}
      {{- end }}
      traces:
        enabled: {{ .Values.broker.telemetry.traces.enabled }}
        sampling_rate: {{ .Values.broker.telemetry.traces.samplingRate }}
        propagators:
          {{- toYaml .Values.broker.telemetry.traces.propagators | nindent 10 }}
      metrics:
        enabled: {{ .Values.broker.telemetry.metrics.enabled }}
        export_interval: {{ .Values.broker.telemetry.metrics.exportInterval | quote }}
      logs:
        enabled: {{ .Values.broker.telemetry.logs.enabled }}
      exporter:
        protocol: {{ .Values.broker.telemetry.exporter.protocol | quote }}
        {{- if .Values.broker.telemetry.exporter.endpoint }}
        endpoint: {{ .Values.broker.telemetry.exporter.endpoint | quote }}
        {{- end }}
        {{- if .Values.broker.telemetry.exporter.headers }}
        headers:
          {{- toYaml .Values.broker.telemetry.exporter.headers | nindent 10 }}
        {{- end }}
        timeout: {{ .Values.broker.telemetry.exporter.timeout | quote }}
        compression: {{ .Values.broker.telemetry.exporter.compression | quote }}
        insecure: {{ .Values.broker.telemetry.exporter.insecure }}
    {{- end }}

    {{- if eq .Values.storage.type "postgres" }}
    # Storage configuration (overridden by environment variables)
    # Environment variables IDENTITY_BROKER_STORAGE_BACKEND and
    # IDENTITY_BROKER_STORAGE_POSTGRES_URL take precedence
    storage:
      backend: postgres
    {{- else }}
    # Storage configuration (in-memory)
    storage:
      backend: memory
    {{- end }}

    {{- if .Values.broker.extraConfig }}
    # Additional configuration
    {{- toYaml .Values.broker.extraConfig | nindent 4 }}
    {{- end }}
