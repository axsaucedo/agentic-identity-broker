apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentic-identity-broker.fullname" . }}-config
  labels:
    {{- include "agentic-identity-broker.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Agentic Identity Broker Configuration
    # Generated by Helm chart

    # Logging configuration
    log:
      level: {{ .Values.broker.log.level }}
      format: {{ .Values.broker.log.format }}

    # Server configuration
    server:
      # End-user API
      enduser:
        port: {{ .Values.broker.server.enduser.port }}
        bind: {{ .Values.broker.server.enduser.bind | quote }}
        {{- if .Values.broker.server.enduser.publicUrl }}
        public_url: {{ .Values.broker.server.enduser.publicUrl }}
        {{- end }}
        authentication:
          preauth:
            principal_header_name: {{ .Values.broker.server.enduser.authentication.preauth.principalHeaderName }}

      # Admin API
      admin:
        port: {{ .Values.broker.server.admin.port }}
        bind: {{ .Values.broker.server.admin.bind | quote }}
        {{- if .Values.broker.server.admin.publicUrl }}
        public_url: {{ .Values.broker.server.admin.publicUrl }}
        {{- end }}
        authentication:
          preauth:
            principal_header_name: {{ .Values.broker.server.admin.authentication.preauth.principalHeaderName }}

      # Graceful shutdown
      shutdown:
        timeout: {{ .Values.broker.server.shutdown.timeout }}

    # Third-party OAuth2 configuration
    third_party_oauth2:
      jwe_signing_key: ${IDENTITY_BROKER_JWE_SIGNING_KEY}

    {{- if .Values.broker.oauth2AuthorizationServer.upstreamIssuerUri }}
    # OAuth2 Authorization Server configuration
    oauth2_authorization_server:
      upstream_issuer_uri: {{ .Values.broker.oauth2AuthorizationServer.upstreamIssuerUri }}
      upstream_authorize_endpoint: {{ .Values.broker.oauth2AuthorizationServer.upstreamAuthorizeEndpoint }}
      upstream_token_endpoint: {{ .Values.broker.oauth2AuthorizationServer.upstreamTokenEndpoint }}
      public_base_url: {{ .Values.broker.oauth2AuthorizationServer.publicBaseUrl }}
      supported_response_types:
        {{- toYaml .Values.broker.oauth2AuthorizationServer.supportedResponseTypes | nindent 8 }}
      supported_grant_types:
        {{- toYaml .Values.broker.oauth2AuthorizationServer.supportedGrantTypes | nindent 8 }}
      upstream_timeout_seconds: {{ .Values.broker.oauth2AuthorizationServer.upstreamTimeoutSeconds }}
      mode: {{ .Values.broker.oauth2AuthorizationServer.mode }}
    {{- end }}

    # Security configuration
    security:
      skip_thirdparty_https_validation: {{ .Values.broker.security.skipThirdpartyHttpsValidation }}

    {{- if eq .Values.storage.type "postgres" }}
    # Storage configuration (overridden by environment variables)
    # Environment variables IDENTITY_BROKER_STORAGE_BACKEND and
    # IDENTITY_BROKER_STORAGE_POSTGRES_URL take precedence
    storage:
      backend: postgres
    {{- else }}
    # Storage configuration (in-memory)
    storage:
      backend: memory
    {{- end }}

    {{- if .Values.broker.extraConfig }}
    # Additional configuration
    {{- toYaml .Values.broker.extraConfig | nindent 4 }}
    {{- end }}
