# GitHub Copilot Coding Agent Setup Steps
# This workflow is used by GitHub Copilot to set up the development environment
# before it can compile and run tests on this repository.
#
# See: https://docs.github.com/en/copilot/customizing-copilot/customizing-the-development-environment-for-copilot-coding-agent

name: "Copilot Setup Steps"

on: workflow_dispatch

# Allow network access to hosts needed for tool installation
env:
  COPILOT_AGENT_FIREWALL_ALLOW_LIST_ADDITIONS: "just.systems"

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission. If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Aggressive cleanup
        run: |
          # Remove Java (JDKs)
          sudo rm -rf /usr/lib/jvm
      
          # Remove .NET SDKs
          sudo rm -rf /usr/share/dotnet
      
          # Remove Swift toolchain
          sudo rm -rf /usr/share/swift
      
          # Remove Haskell (GHC)
          sudo rm -rf /usr/local/.ghcup
      
          # Remove Julia
          sudo rm -rf /usr/local/julia*
      
          # Remove Android SDKs
          sudo rm -rf /usr/local/lib/android
      
          # Remove Microsoft/Edge and Google Chrome builds
          sudo rm -rf /opt/microsoft /opt/google
      
          # Remove Azure CLI
          sudo rm -rf /opt/az
      
          # Remove PowerShell
          sudo rm -rf /usr/local/share/powershell
      
          # Remove CodeQL and other toolcache contents, but preserve the toolcache directory
          if [ -d /opt/hostedtoolcache ]; then
            sudo find /opt/hostedtoolcache -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi
      
          docker system prune -af || true
          docker builder prune -af || true
          df -h

      # Set up Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # Set up Node.js (for web frontend)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # Cache Go tool binaries, golangci-lint results, and Playwright browsers
      - name: Cache dev tools
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/.cache/golangci-lint
            ~/.cache/ms-playwright
          key: tools-${{ runner.os }}-${{ hashFiles('justfile') }}
          restore-keys: tools-${{ runner.os }}-

      # Install just command runner
      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      # Install other tools
      - name: "Install Tools via `just install-tools`"
        run: just install-tools

      # Install web dependencies
      - name: Install web dependencies
        run: cd web && npm ci

      # Verify installation
      - name: Verify tools
        run: |
          echo "=== Tool Versions ==="
          echo "Go: $(go version)"
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "just: $(just --version)"
          echo "ginkgo: $(ginkgo version)"
          echo "golangci-lint: $(golangci-lint --version)"
          echo "=== Build Test ==="
          just build
          echo "=== Ready for Copilot ===" 
