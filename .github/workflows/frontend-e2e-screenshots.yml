name: Frontend E2E Screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  frontend-e2e:
    runs-on: ubuntu-latest
    # Skip forked PRs — can't push back and token is read-only
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Skip if last commit is automated screenshot update
        id: skip-check
        run: |
          LAST_MSG=$(git log -1 --format="%s" HEAD)
          echo "Last commit message: $LAST_MSG"
          if [ "$LAST_MSG" = "Update frontend E2E screenshots" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: last commit is an automated screenshot update"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Set up Node.js
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Cache Playwright browsers
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Ginkgo
        if: steps.skip-check.outputs.skip != 'true'
        run: go install github.com/onsi/ginkgo/v2/ginkgo@v2.28.1

      - name: Install Playwright browsers
        if: steps.skip-check.outputs.skip != 'true'
        run: go run github.com/playwright-community/playwright-go/cmd/playwright@v0.5700.1 install --with-deps

      - name: Install web dependencies
        if: steps.skip-check.outputs.skip != 'true'
        run: cd web && npm ci

      - name: Build frontend
        if: steps.skip-check.outputs.skip != 'true'
        run: cd web && npm run build

      - name: Run frontend E2E tests
        if: steps.skip-check.outputs.skip != 'true'
        id: tests
        run: E2E_FRONTEND_MODE=built ginkgo -v ./tests/e2e/frontend/
        continue-on-error: true

      - name: Sync screenshots to tracked directory
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          SRC="tests/e2e/frontend/coverage/screenshots"
          DEST="tests/e2e/screenshots"
          if [ -d "$SRC" ]; then
            # Collect new screenshots
            NEW_FILES=$(find "$SRC" -name "*.png" -type f 2>/dev/null)
            if [ -n "$NEW_FILES" ]; then
              echo "Syncing screenshots from $SRC to $DEST"
              # Remove old screenshots and replace with fresh ones
              rm -f "$DEST"/*.png
              cp "$SRC"/*.png "$DEST/"
            else
              echo "No screenshots found in $SRC"
            fi
          else
            echo "Screenshot source directory does not exist: $SRC"
          fi

      - name: Commit and push screenshot changes
        if: steps.skip-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add tests/e2e/screenshots/
          if git diff --staged --quiet; then
            echo "No screenshot changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            git commit -m "Update frontend E2E screenshots"
            git push
          fi

      - name: Upload screenshots as artifact
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots/*.png
          if-no-files-found: ignore

      - name: Update PR description with screenshots
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Get the current PR state (includes latest head SHA after any push)
            const { data: currentPR } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            // Compare base branch to head branch to find all changed screenshots in the PR
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${pr.base.ref}...${currentPR.head.sha}`,
            });

            const changedScreenshots = (comparison.files || []).filter(
              (f) =>
                f.filename.startsWith("tests/e2e/screenshots/") &&
                f.filename.endsWith(".png") &&
                f.status !== "removed"
            );

            if (changedScreenshots.length === 0) {
              core.info("No screenshot changes found in this PR");
              return;
            }

            // Use github.com/.../raw/ URLs — these go through GitHub's auth layer
            // and work for any authenticated user with repo access (unlike
            // raw.githubusercontent.com which requires a separate token for private repos)
            const headSha = currentPR.head.sha;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let screenshotSection = "## Screenshots\n\n";
            screenshotSection += `> [Download all screenshots (workflow artifact) ↗](${runUrl})\n\n`;
            for (const file of changedScreenshots) {
              const name = file.filename.split("/").pop().replace(".png", "").replaceAll("_", " ");
              const imgUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/raw/${headSha}/${file.filename}`;
              screenshotSection += `### ${name}\n![${name}](${imgUrl})\n\n`;
            }

            let body = currentPR.body || "";

            // Remove existing Screenshots section if present
            const screenshotsHeader = "\n## Screenshots";
            const screenshotsIdx = body.indexOf(screenshotsHeader);
            if (screenshotsIdx !== -1) {
              // Find the next ## heading after the screenshots section
              const afterHeader = body.indexOf("\n## ", screenshotsIdx + screenshotsHeader.length);
              if (afterHeader !== -1) {
                body = body.substring(0, screenshotsIdx) + body.substring(afterHeader);
              } else {
                body = body.substring(0, screenshotsIdx);
              }
              body = body.trimEnd();
            }

            // Append new screenshots section
            body += "\n\n" + screenshotSection.trimEnd();

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: body,
            });

            core.info(`Updated PR #${pr.number} with ${changedScreenshots.length} screenshot(s)`);

      - name: Fail if tests failed
        if: steps.skip-check.outputs.skip != 'true' && steps.tests.outcome == 'failure'
        run: |
          echo "Frontend E2E tests failed. See the test step for details."
          exit 1
