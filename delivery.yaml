version: "2017-09-20"

tags:
  application: agentic-identity-broker

pipeline:
  - id: test
    type: script
    vm_config:
      type: linux
      size: large
      image: cdp-runtime/go-1.26
    cache:
      paths:
        # Go module download cache (stable — only changes when go.mod/go.sum change)
        - /go/pkg/mod
        # npm package cache (stable — only changes when package-lock.json changes)
        - ~/.npm
        # Playwright browser binaries (stable — only changes when playwright version is bumped)
        - ~/.cache/ms-playwright
        # NOTE: ~/.cache/go-build and ~/.cache/golangci-lint are intentionally excluded.
        # They change on every source commit, causing a full cache re-upload (~7min) that
        # negates any compilation speedup they provide.
      size_limit_megabytes: 4096
    commands:
      - desc: "Install pre-requisites"
        cmd: |
          apt-get update
          apt-get --yes install just curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get --yes install nodejs
          just install-tools
          just web-ci
      - desc: "Run quality checks"
        cmd: |
          just check
      - desc: "Run verification suite"
        cmd: |
          GINKGO_BACKEND_PROCS=4 GINKGO_EXTPROC_PROCS=4 GINKGO_FRONTEND_PROCS=2 E2E_CAPTURE_SCREENSHOTS=false \
            cdp-wrap-cmd "just verify-junit" "cdp-tool upload-test-results -t junit $(pwd)/test-results/all-tests-junit.xml"
      - desc: "Run artifacts build test"
        cmd: |
          just build-all
          test -f web/dist/consent/index.html

  - id: release
    type: script
    when:
      - event: push
        branch: main
    vm_config:
      type: linux
      image: cdp-runtime/go-1.26
    cache:
      paths:
        # Go module download cache (stable — only changes when go.mod/go.sum change)
        - /go/pkg/mod
        # npm package cache (stable — only changes when package-lock.json changes)
        - ~/.npm
      size_limit_megabytes: 2048
    commands:
      - desc: "Build and push Docker images (broker + migrate + extproc)"
        cmd: |
          apt-get update
          apt-get --yes install just curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get --yes install nodejs
          just install-tools
          just web-ci

          IMAGE_NAME="${CDP_REGISTRY}/infosec/agentic-identity-broker"

          if [ -z "$CDP_PULL_REQUEST_NUMBER" ]; then
            just VERSION="${CDP_BUILD_VERSION}" IMAGE_NAME="${IMAGE_NAME}" docker-push
            just VERSION="${CDP_BUILD_VERSION}" IMAGE_NAME="${IMAGE_NAME}" docker-promote
          else
            just VERSION="${CDP_BUILD_VERSION}" IMAGE_NAME="${IMAGE_NAME}" docker-build-all
          fi
      - desc: git-tag
        cmd: |
          if [ -z "$CDP_PULL_REQUEST_NUMBER" ]; then
            git gh-tag "${CDP_BUILD_VERSION}"
          fi
