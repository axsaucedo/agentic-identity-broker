version: "2017-09-20"

tags:
  application: agentic-identity-broker

pipeline:
  - id: test
    type: script
    vm_config:
      type: linux
      image: cdp-runtime/go-1.25
    cache:
      paths:
        # pkg cache for Go modules and Go build cache
        - /go/pkg/mod
        - ~/.cache/go-build
        # golangci-lint incremental result cache
        - ~/.cache/golangci-lint
        # npm package cache
        - ~/.npm
        # Playwright browser binaries
        - ~/.cache/ms-playwright
      size_limit_megabytes: 6500
    commands:
      - desc: "Install pre-requisites"
        cmd: |
          apt-get update
          apt-get --yes install just curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get --yes install nodejs
          just install-tools
          just web-ci
      - desc: "Run quality checks"
        cmd: |
          just check
      - desc: "Run all tests (unit + integration)"
        cmd: |
          cdp-wrap-cmd "just test-all-junit" "cdp-tool upload-test-results -t junit $(pwd)/test-results/all-tests-junit.xml"
      - desc: "Run artifacts build test"
        cmd: |
          just build-all

  - id: release
    type: script
    vm_config:
      type: linux
      image: cdp-runtime/go-1.25
    cache:
      paths:
        # pkg cache for Go modules and Go build cache
        - /go/pkg/mod
        - $HOME/.cache/go-build
        # compiled Go tool binaries (golangci-lint, ginkgo, go-junit-report, air)
        - /go/bin
        # golangci-lint incremental result cache
        - $HOME/.cache/golangci-lint
        # npm package cache (speeds up npm ci)
        - $HOME/.npm
        # Playwright browser binaries (~500MB — dominant install cost)
        - $HOME/.cache/ms-playwright
    commands:
      - desc: "Build and push Docker images (broker + migrate + extproc)"
        cmd: |
          apt-get update
          apt-get --yes install just curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get --yes install nodejs
          just install-tools
          just web-ci

          IMAGE_NAME="${CDP_REGISTRY}/infosec/agentic-identity-broker"

          if [ -z "$CDP_PULL_REQUEST_NUMBER" ]; then
            just VERSION="${CDP_BUILD_VERSION}" IMAGE_NAME="${IMAGE_NAME}" docker-push
            just VERSION="${CDP_BUILD_VERSION}" IMAGE_NAME="${IMAGE_NAME}" docker-promote
          else
            just VERSION="${CDP_BUILD_VERSION}" IMAGE_NAME="${IMAGE_NAME}" docker-build-all
          fi
      - desc: git-tag
        cmd: |
          if [ -z "$CDP_PULL_REQUEST_NUMBER" ]; then
            git gh-tag "${CDP_BUILD_VERSION}"
          fi