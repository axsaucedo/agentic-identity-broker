# Agentic Identity Broker Configuration
# This is the default configuration file for development

# Logging configuration
log:
  level: debug
  format: json

# Server configuration - dual-port HTTP servers
server:
  # End-user facing server (public API)
  enduser:
    port: 8000
    bind: "::" # Dual-stack (IPv6 with IPv4 fallback)
    # Authentication - preauth mode (trust principals from reverse proxy headers)
    authentication:
      preauth:
        principal_header_name: X-Remote-User

  # Admin server (internal management API)
  admin:
    port: 14000
    bind: "::" # Dual-stack (IPv6 with IPv4 fallback)
    # Authentication - preauth mode (trust principals from reverse proxy headers)
    authentication:
      preauth:
        principal_header_name: X-Remote-User

  # Graceful shutdown configuration
  shutdown:
    timeout: 30s # Maximum time to wait for in-flight requests to complete
